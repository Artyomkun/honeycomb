apiVersion: v1
kind: Service
metadata:
  name: {{ include "oracle-region.fullname" . }}
  labels:
    app: oracle-region
    region: {{ .Values.region }}
spec:
  # Headless Service — позволяет напрямую обращаться к конкретному поду
  clusterIP: None
  selector:
    app: oracle-region
  ports:
  - name: oracle
    port: {{ .Values.service.port }}
    targetPort: 1521
    protocol: TCP
---
{{- if .Values.service.loadBalancer.enabled }}
# Опционально: отдельный LoadBalancer для внешнего доступа (например, для DBeaver)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oracle-region.fullname" . }}-external
  labels:
    app: oracle-region
    region: {{ .Values.region }}
  annotations:
    # Отключаем защиту от сквозного прохождения IP (для отладки)
    service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
spec:
  type: LoadBalancer
  selector:
    app: oracle-region
  ports:
  - name: oracle
    port: {{ .Values.service.externalPort }}
    targetPort: 1521
    protocol: TCP
{{- end }}