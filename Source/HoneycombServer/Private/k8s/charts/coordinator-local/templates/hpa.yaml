{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "coordinator-local.fullname" . }}
  labels:
    app: coordinator-local
    region: {{ .Values.region }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "coordinator-local.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
  # Стандартные метрики
  {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  # Кастомная метрика — количество активных чанков на под
  - type: Pods
    pods:
      metric:
        name: active_chunks_per_pod
      target:
        type: AverageValue
        averageValue: {{ .Values.autoscaling.targetActiveChunks }}
  # Кастомная метрика — количество игроков на под
  - type: Pods
    pods:
      metric:
        name: players_per_pod
      target:
        type: AverageValue
        averageValue: {{ .Values.autoscaling.targetPlayersPerPod }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
{{- end }}