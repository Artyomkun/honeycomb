apiVersion: v1
kind: Service
metadata:
  name: {{ include "global-coordinator.fullname" . }}
  labels:
    app: global-coordinator
spec:
  # ClusterIP для внутреннего доступа внутри кластера
  type: ClusterIP
  selector:
    app: global-coordinator
  ports:
  - name: grpc
    port: {{ .Values.service.grpcPort }}
    targetPort: {{ .Values.service.grpcPort }}
    protocol: TCP
  - name: http
    port: {{ .Values.service.httpPort }}
    targetPort: {{ .Values.service.httpPort }}
    protocol: TCP
  - name: metrics
    port: {{ .Values.service.metricsPort }}
    targetPort: {{ .Values.service.metricsPort }}
    protocol: TCP
---
{{- if .Values.service.loadBalancer.enabled }}
# Опционально: отдельный LoadBalancer для доступа из других кластеров/регионов
apiVersion: v1
kind: Service
metadata:
  name: {{ include "global-coordinator.fullname" . }}-external
  labels:
    app: global-coordinator
  annotations:
    # Для AWS — используем Network Load Balancer для лучшей производительности
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # Для GCP:
    cloud.google.com/load-balancer-type: "Internal"
    # Для Azure:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: global-coordinator
  ports:
  - name: grpc
    port: {{ .Values.service.externalGrpcPort }}
    targetPort: {{ .Values.service.grpcPort }}
    protocol: TCP
  {{- if .Values.service.loadBalancer.enableHttp }}
  - name: http
    port: {{ .Values.service.externalHttpPort }}
    targetPort: {{ .Values.service.httpPort }}
    protocol: TCP
  {{- end }}
  {{- if .Values.service.loadBalancer.enableMetrics }}
  - name: metrics
    port: {{ .Values.service.externalMetricsPort }}
    targetPort: {{ .Values.service.metricsPort }}
    protocol: TCP
  {{- end }}
  # Сохраняем реальный IP клиента
  externalTrafficPolicy: Local
{{- end }}