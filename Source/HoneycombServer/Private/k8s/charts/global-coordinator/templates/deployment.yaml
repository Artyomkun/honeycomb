apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "global-coordinator.fullname" . }}
  labels:
    app: global-coordinator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: global-coordinator
  template:
    metadata:
      labels:
        app: global-coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "global-coordinator.serviceAccountName" . }}
      containers:
      - name: coordinator
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.grpcPort }}
          name: grpc
        - containerPort: {{ .Values.service.httpPort }}
          name: http
        - containerPort: {{ .Values.service.metricsPort }}
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "{{ .Values.redis.host }}:{{ .Values.redis.port }}"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.passwordSecret.name }}
              key: {{ .Values.redis.passwordSecret.key }}
        - name: REGION_SYNC_INTERVAL
          value: {{ .Values.coordinator.regionSyncInterval | quote }}
        - name: MIGRATION_TTL
          value: {{ .Values.coordinator.migrationTTL | quote }}
        - name: MAX_CONCURRENT_MIGRATIONS
          value: {{ .Values.coordinator.maxConcurrentMigrations | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.logging.level }}
        - name: METRICS_PORT
          value: {{ .Values.metrics.port | quote }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5