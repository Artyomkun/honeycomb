# Глобальные настройки
global:
  environment: "production"

# Количество реплик
replicaCount: 3

# Образ
image:
  repository: honeycomb/global-coordinator
  tag: "1.0.0"
  pullPolicy: Always

# Настройки портов
service:
  grpcPort: 50053
  httpPort: 8080
  metricsPort: 9090

# Ресурсы
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# Автомасштабирование
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  targetRequestsPerSecond: 1000

# Подключение к глобальному Redis
redis:
  host: "redis-global"
  port: 6379
  passwordSecret:
    name: "honeycomb-global-secrets"
    key: redis-password

# Настройки глобального координатора
coordinator:
  # Интервал синхронизации регионов (в секундах)
  regionSyncInterval: 30
  # Время жизни миграции игрока (в секундах)
  migrationTTL: 300
  # Максимальное количество одновременных миграций
  maxConcurrentMigrations: 1000

# Логирование
logging:
  level: "info"
  format: "json"
  output: "stdout"

# Метрики
metrics:
  enabled: true
  port: 9090
  path: "/metrics"

# Health Check
healthCheck:
  enabled: true
  path: "/health"
  port: 8080

# PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Терминация
terminationGracePeriodSeconds: 30

# Service Account
serviceAccount:
  create: true
  name: "global-coordinator"

# Дополнительные аннотации
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

nodeSelector: {}
tolerations: []

secrets:
  create: false