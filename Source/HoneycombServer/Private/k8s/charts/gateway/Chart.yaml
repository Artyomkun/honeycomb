apiVersion: v2
name: gateway
description: |
  Gateway for Honeycomb VR.
  Handles client WebSocket/HTTP3 connections, authentication, and routing.

# Тип чарта (application или library)
type: application

# Версия чарта (SemVer 2.0)
version: 0.1.0

# Версия приложения (например, версия твоего бинарника)
appVersion: "1.0.0"

# Домашняя страница проекта
home: https://honeycomb.world

# Ключевые слова для поиска
keywords:
  - gateway
  - vr
  - multiplayer
  - honeycomb

# Информация об авторах
maintainers:
  - name: Artem Selemet
    email: selemetartem@gmail.com
    url: https://github.com/Artyomkun

# Зависимости (если есть)
dependencies:
  - name: redis-region
    version: ">=0.1.0"
    repository: "file://../redis-region"
    condition: redis-region.enabled

# Минимальная версия Kubernetes
kubeVersion: ">=1.28.0"

# Аннотации для дополнительной информации
annotations:
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.honeycomb.world
  artifacthub.io/operator: "false"