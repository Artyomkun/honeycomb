apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}-udp
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    cloud.google.com/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - name: game-udp
    port: 7777
    targetPort: 7777
    protocol: UDP
  externalTrafficPolicy: Local   # сохраняет реальный IP клиента