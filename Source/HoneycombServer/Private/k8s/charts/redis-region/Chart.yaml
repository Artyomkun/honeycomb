apiVersion: v2
name: redis-region
description: |
  Redis cache cluster for the Honeycomb VR world.
  Each region runs its own Redis cluster to keep session data and game state close to the game servers.

# Тип чарта
type: application

# Версия чарта (увеличивай при изменении шаблонов)
version: 0.1.0

# Версия самого Redis
appVersion: "7.2.4"

# Где живёт проект
home: https://honeycomb.world

# Ключевые слова для поиска в ArtifactHub
keywords:
  - redis
  - cache
  - database
  - honeycomb

# Кто поддерживает чарт
maintainers:
  - name: Artem Selemet
    email: selemetartem@gmail.com
    url: https://github.com/Artyomkun

# Минимальная версия Kubernetes
kubeVersion: ">=1.28.0"

# Аннотации для дополнительной информации
annotations:
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.honeycomb.world
  artifacthub.io/operator: "false"