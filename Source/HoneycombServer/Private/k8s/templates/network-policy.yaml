apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-game-server
spec:
  podSelector:
    matchLabels:
      app: game-server
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway
    ports:
    - port: 7777
      protocol: UDP
    - port: 50051
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-game-server-to-redis
spec:
  podSelector:
    matchLabels:
      app: game-server
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-region
    ports:
    - port: 6379
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-game-server-to-oracle
spec:
  podSelector:
    matchLabels:
      app: game-server
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: oracle-region
    ports:
    - port: 1521
      protocol: TCP