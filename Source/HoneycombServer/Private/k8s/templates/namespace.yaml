{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "honeycomb.labels" . | nindent 4 }}
    {{- include "honeycomb.regionLabel" . | nindent 4 }}
    # Дополнительные метки для мониторинга и политик
    app.kubernetes.io/environment: {{ .Values.environment | default "production" }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}