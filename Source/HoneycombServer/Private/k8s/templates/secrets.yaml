{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "honeycomb.fullname" . }}-secrets
  labels:
    {{- include "honeycomb.labels" . | nindent 4 }}
    {{- include "honeycomb.regionLabel" . | nindent 4 }}
type: Opaque
data:
  # Oracle
  oracle-dsn: {{ .Values.secrets.oracle.dsn | b64enc | quote }}
  oracle-password: {{ .Values.secrets.oracle.password | b64enc | quote }}

  # Redis
  redis-password: {{ .Values.secrets.redis.password | b64enc | quote }}

  # JWT / API ключи
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  api-key: {{ .Values.secrets.apiKey | b64enc | quote }}
{{- end }}